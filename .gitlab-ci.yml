# Integració contínua (CI) del projecte.
#
# Aquest projecte no inclou cap component de fp-dev-academy/comu: cap no hi
# encaixa a la versió 1.0.0.
#  - python-tests fa servir la imatge python:<versió>-slim, que no porta git,
#    i el generador i els tests en necessiten.
#  - python-tests executa pytest amb un requirements.txt, i aquest projecte
#    no té cap dependència: els tests són de unittest.
# Si un altre projecte del grup necessita el mateix, es pot convertir en un
# component de comu (vegeu comu/FULL-DE-RUTA.md).

tests:
  stage: test
  # Imatge completa (no -slim): porta git, bash, perl i tar, que fan servir
  # el generador i les solucions de referència.
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      # 3.12: versió mínima (CLAUDE.md). 3.15: la de l'alumnat (Windows 11).
      - PYTHON_VERSION: ["3.12", "3.15"]
  script:
    - python --version
    - git --version
    # Definició de feina acabada (CLAUDE.md): determinisme del generador,
    # solucions correctes i incorrectes de cada pas, conflicte del pas 05,
    # bisect del pas 06 i aplicació funcionant a cada tag.
    - python -m unittest discover -s tests -v
